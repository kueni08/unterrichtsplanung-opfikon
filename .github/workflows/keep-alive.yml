name: Supabase wach halten

# Der Gratis-Plan pausiert ein Projekt nach 7 Tagen ohne Zugriffe. Dieser Zeitplan stupst das
# Projekt alle zwei Tage an (zählt als Aktivität) und stellt es – falls trotzdem pausiert und ein
# SUPABASE_ACCESS_TOKEN als Repository-Secret hinterlegt ist – automatisch wieder her.

on:
  schedule:
    - cron: "17 5 */2 * *"   # alle zwei Tage um 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://gppbxybdteihpoawyxpy.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_w6jOmcVIq-oaXK7eAraAJA_7uKW8dEr' }}
  PROJECT_REF: gppbxybdteihpoawyxpy

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Datenbank anstupsen (REST-Abfrage mit öffentlichem Schlüssel)
        id: ping
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/teams?select=id&limit=1")
          # 401 ist hier normal: der öffentliche Schlüssel darf nichts lesen, die Anfrage erreicht die Datenbank trotzdem.
          echo "REST (Datenbank): HTTP $code - $(head -c 120 /tmp/body)"
          root=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/rest/v1/")
          echo "REST (API-Wurzel): HTTP $root"
          auth=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health")
          echo "Auth health: HTTP $auth"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "auth=$auth" >> "$GITHUB_OUTPUT"

      - name: Status prüfen und bei Pause wiederherstellen (nur mit SUPABASE_ACCESS_TOKEN)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          status=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" | sed -n 's/.*"status":"\([A-Z_]*\)".*/\1/p')
          echo "Projektstatus: $status"
          if [ "$status" = "INACTIVE" ]; then
            echo "Projekt ist pausiert - stelle wieder her ..."
            curl -s -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/restore"
            echo
          fi

      - name: Ergebnis
        run: |
          case "${{ steps.ping.outputs.code }}" in 2*|4*) ok=1 ;; *) ok=0 ;; esac
          if [ "$ok" != "1" ] || [ "${{ steps.ping.outputs.auth }}" != "200" ]; then
            echo "::warning::Das Supabase-Projekt antwortet nicht normal (Datenbank HTTP ${{ steps.ping.outputs.code }}, Auth ${{ steps.ping.outputs.auth }}). Falls pausiert: im Dashboard unter https://supabase.com/dashboard/project/$PROJECT_REF wieder starten oder SUPABASE_ACCESS_TOKEN als Secret hinterlegen."
          fi
